name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["21", "23"]
    steps:
      - uses: actions/checkout@v4
      - name: Install Clojure CLI and nftables (for emit-nft syntax check)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables
          curl -sO https://download.clojure.org/install/linux-install.sh
          sudo bash linux-install.sh
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: ${{ matrix.java }}
      - name: Cache clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-
      - name: Lint (clj-kondo)
        run: clojure -M:kondo --lint src test --fail-level error
      - name: Formatting (cljfmt)
        run: clojure -M:fmt check src test
      - name: Unit tests + generative + adversarial + architecture
        run: clojure -M:test
      - name: Install trivy
        run: ./bin/install-trivy.sh
      - name: Harness (full)
        shell: bash
        run: |
          set -o pipefail
          status=0
          clojure -M:harness all > /tmp/harness.log 2>&1 || status=$?
          # Surface failures as public check annotations
          grep -E '^❌|^    ' /tmp/harness.log | head -40 | sed 's/^/::error message=/' || true
          cat /tmp/harness.log | tee "$GITHUB_STEP_SUMMARY"
          exit $status

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "21"
          graalvm-native-image: true
      - name: Install Clojure CLI and nftables (for emit-nft syntax check)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables
          curl -sO https://download.clojure.org/install/linux-install.sh
          sudo bash linux-install.sh
      - name: Cache clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-native-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-native-
      - name: Verify GraalVM
        run: |
          java -version 2>&1 | head -2
          native-image --version 2>&1 | head -1
      - name: Run tests under GraalVM JIT
        run: |
          clojure -M:kondo --lint src test --fail-level error
          clojure -M:test
