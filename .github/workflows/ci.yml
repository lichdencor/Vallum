name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["21", "23"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.0.1536
      - name: Cache clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clj-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-
      - name: Lint (clj-kondo)
        run: clojure -M:kondo --lint src test --fail-level error
      - name: Formatting (cljfmt)
        run: clojure -M:fmt check src test
      - name: Unit tests + generative + adversarial + architecture
        run: clojure -M:test
      - name: Harness (full)
        run: clojure -M:harness all

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "21"
          graalvm-native-image: true
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.0.1536
      - name: Cache clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-native-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-native-
      - name: Verify GraalVM
        run: |
          java -version 2>&1 | head -2
          native-image --version 2>&1 | head -1
      - name: Run tests under GraalVM JIT
        run: |
          clojure -M:kondo --lint src test --fail-level error
          clojure -M:test
