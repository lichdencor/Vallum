# Vallum — pre-commit hooks
#
# Two paths, same source of truth (bin/hooks/):
#
#   A) Plain git, no dependencies:   ./bin/install-git-hooks.sh   ← recommended
#   B) pre-commit (Python), if you already have it:  pre-commit install
#
# Lint/format/tests run via deps.edn (clj-kondo and cljfmt as Maven deps,
# versioned in this repo) — no installed binaries required.
# Trivy is an external binary: install it with ./bin/install-trivy.sh; if
# missing, the hook warns and continues (hard enforcement lives in `clojure -M:harness all`).

repos:
  - repo: local
    hooks:
      - id: vallum-harness-fast
        name: Vallum fast suite (kondo + cljfmt + architecture + tests)
        entry: bin/hooks/pre-commit.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: vallum-trivy
        name: Trivy fs scan (soft skip if not installed)
        entry: bin/hooks/trivy.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: conventional-commits
        name: Conventional Commits
        entry: bin/hooks/commit-msg.sh
        language: system
        stages: [commit-msg]
        always_run: true

  # General file hygiene (needs the Python pre-commit package)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

ci:
  autofix_prs: false
  skip: []
  submodules: false
